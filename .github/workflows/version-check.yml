name: Version & Changelog Check

on:
  pull_request:
    branches: [main]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump
        run: |
          PR_VERSION=$(python -c "
          import re
          with open('rpg_tools/__init__.py') as f:
              match = re.search(r'__version__\s*=\s*\"(.+?)\"', f.read())
              print(match.group(1))
          ")

          MAIN_VERSION=$(git show origin/main:rpg_tools/__init__.py | python -c "
          import re, sys
          match = re.search(r'__version__\s*=\s*\"(.+?)\"', sys.stdin.read())
          print(match.group(1))
          ")

          echo "PR version: $PR_VERSION"
          echo "Main version: $MAIN_VERSION"

          python -c "
          pr = tuple(int(x) for x in '$PR_VERSION'.split('.'))
          main = tuple(int(x) for x in '$MAIN_VERSION'.split('.'))
          if pr <= main:
              print('ERROR: PR version ($PR_VERSION) must be greater than main version ($MAIN_VERSION)')
              exit(1)
          print('Version check passed: $PR_VERSION > $MAIN_VERSION')
          "

      - name: Check changelog entry exists for current version
        run: |
          VERSION=$(python -c "
          import re
          with open('rpg_tools/__init__.py') as f:
              match = re.search(r'__version__\s*=\s*\"(.+?)\"', f.read())
              print(match.group(1))
          ")

          echo "Current version: $VERSION"

          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "Changelog entry found for version $VERSION"
          else
            echo "ERROR: No changelog entry found for version $VERSION"
            echo "Please add a '## [$VERSION]' section to CHANGELOG.md"
            exit 1
          fi
